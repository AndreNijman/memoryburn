<meta name="description" content="A free browser wave-survival shooter. Somebody burned out your memory and is selling it at forty eddies a hit. Fight 15 contracts across a cyberpunk city to get it back.">

<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='17' rx='12' ry='12' fill='%23e3b071' stroke='%231c1622' stroke-width='2.5'/%3E%3Crect x='6' y='12' width='20' height='6' rx='2' fill='%234ff0d8' stroke='%231c1622' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#0d0912;color:#fbf6ec;
  font-family:Nunito,system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:crosshair}
#splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:#0d0912;transition:opacity .3s}
#splash.hide{opacity:0;pointer-events:none}
#splash h1{margin:0;font:400 clamp(36px,7vw,88px)/1 "Lilita One","Arial Black",sans-serif;color:#ffd35a;-webkit-text-stroke:3px #1c1622;letter-spacing:.02em}
#splash p{margin:0;opacity:.7}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,6,16,.9);padding:16px;z-index:10}
#err.show{display:flex}
#err pre{max-width:820px;width:100%;max-height:80vh;overflow:auto;white-space:pre-wrap;background:#2a2236;border:3px solid #ef4d5f;border-radius:12px;padding:16px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Memory Burn game"></canvas>
<div id="splash"><h1>MEMORY BURN</h1><p id="splash-msg">Re-establishing connection…</p></div>
<div id="err"><pre id="err-text"></pre></div>
<noscript><p style="position:fixed;inset:0;padding:24px;background:#0d0912">Memory Burn needs JavaScript.</p></noscript>
<script>
  window.addEventListener('error', function (e) {
    var el = document.getElementById('err');
    document.getElementById('err-text').textContent = 'Something broke.\n\n' + (e.error && e.error.stack || e.message);
    el.className = 'show';
  });
</script>
<!-- order must match scripts.manifest.json (tools/headless.mjs checks it) -->
<script src="js/core/mb.js"></script>
<script src="js/data/data.js"></script>
<script src="js/data/story.js"></script>
<script src="js/sim/sim.js"></script>
<script src="js/sim/bot.js"></script>
<script src="js/audio/dsp.js"></script>
<script src="js/audio/sounds.js"></script>
<script src="js/audio/songs.js"></script>
<script src="js/render/sprites.js"></script>
<script src="js/render/icons.js"></script>
<script src="js/render/fx.js"></script>
<script src="js/render/render.js"></script>
<script src="js/input/input.js"></script>
<script src="js/audio/music.js"></script>
<script src="js/audio/engine.js"></script>
<script src="js/ui/ui.js"></script>
<script src="js/ui/screens.js"></script>
<script src="js/ui/radio.js"></script>
<script src="js/main.js"></script>
<script>
  (function () {
    var fonts = document.fonts ? Promise.all([
      document.fonts.load('40px "Lilita One"'), document.fonts.load('800 20px Nunito'), document.fonts.load('600 20px Nunito')
    ]) : Promise.resolve();
    var timeout = new Promise(function (r) { setTimeout(r, 2500); });
    Promise.race([fonts, timeout]).catch(function () {}).then(function () {
      MB.main.start();
      document.getElementById('splash').className = 'hide';
    });
  })();
</script>
</body>
</html>
